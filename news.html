<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockline - News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--paper:#F3F4F1;--panel:#FFF;--ink:#1B2430;--soft:#5B6472;--line:#E1E4E0;--blue:#2F5D9A;--blue-dark:#234876;--green:#3F7D4F;--green-bg:#E7F2E9;--red:#B4423A;--red-bg:#FBE9E7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0}.app-shell{display:flex;min-height:100vh}.sidebar{width:216px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow:hidden;transition:width .18s ease,padding .18s ease,opacity .12s ease}.sidebar.collapsed{width:0;padding-left:0;padding-right:0;opacity:0;border-right:0}.sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}.sidebar-brand span{font-family:'Space Grotesk';font-weight:700;font-size:1.02rem;white-space:nowrap}.login-mark{width:40px;height:40px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}.sidebar .login-mark{width:32px;height:32px;font-size:.85rem}.nav-label{font-size:.68rem;font-weight:700;color:var(--soft);letter-spacing:.04em;padding:0 10px;margin:0 0 6px}.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:7px;background:none;width:100%;text-align:left;font:600 .86rem Inter,sans-serif;color:var(--soft);cursor:pointer;margin-bottom:2px;white-space:nowrap}.nav-item i{width:16px;text-align:center;font-size:.85rem}.nav-item:hover{background:var(--paper);color:var(--ink)}.nav-item.active{background:var(--blue);color:#fff}.main-area{flex:1;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}.topbar-left{display:flex;align-items:center;gap:14px}.hamburger{background:none;border:0;cursor:pointer;width:34px;height:34px;border-radius:7px;color:var(--ink);font-size:1rem}.hamburger:hover{background:var(--paper)}.topbar-user{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--soft)}.topbar-user b{color:var(--ink)}.save-indicator{font-size:.76rem;color:var(--soft);min-width:60px}.save-indicator.saved{color:var(--green)}.save-indicator.error{color:#B4423A}.wrap{max-width:900px;margin:0 auto;padding:28px}.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}.page-header p{color:var(--soft);font-size:.88rem;margin:6px 0 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:7px;font:600 .88rem Inter,sans-serif;padding:10px 16px;cursor:pointer}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}.btn-block{width:100%}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.card-header{padding:16px 20px;border-bottom:1px solid var(--line)}.card-header h3{font-size:1.02rem;display:flex;align-items:center;gap:8px}.news-item{padding:18px 20px;border-bottom:1px solid var(--line)}.news-item:last-child{border-bottom:0}.news-item h4{font-size:1.08rem;margin-bottom:6px}.news-item p{color:var(--soft);font-size:.88rem;line-height:1.55;margin:0 0 9px;white-space:pre-wrap}.news-meta{font-size:.74rem;color:var(--soft)}.legend{font-size:.8rem;color:var(--soft);padding:18px 20px;margin:0}.alert{display:none;padding:11px 14px;margin-bottom:18px;border-radius:8px;font-size:.86rem}.alert-success{background:var(--green-bg);color:var(--green)}.alert-error{background:var(--red-bg);color:var(--red)}.modal-overlay{display:none;position:fixed;inset:0;background:#1b24306b;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-overlay.open{display:flex}.modal-box{position:relative;width:100%;max-width:520px;background:#fff;border-radius:12px;padding:26px}.modal-box h3{font-size:1.08rem;margin-bottom:18px}.modal-close{position:absolute;top:18px;right:20px;color:var(--soft);cursor:pointer}.form-group label{display:block;font-size:.78rem;font-weight:600;margin-bottom:5px}.form-group input,.form-group textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.88rem}.modal-actions{margin-top:18px}@media(max-width:720px){.sidebar{position:fixed;top:0;bottom:0;left:0;z-index:10;box-shadow:2px 0 16px #1b24302e}.sidebar.collapsed{box-shadow:none}.wrap{padding:24px 16px}.topbar{padding:14px 16px}.topbar-user span{display:none}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="login-mark"><i class="fa-solid fa-box"></i></div><span>Admin Dashboard</span></div>
    <p class="nav-label">Menu</p>
    <button class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
    <button class="nav-item" onclick="window.location.href='stocks.html'"><i class="fa-solid fa-ruler"></i> Stocks</button>
    <button class="nav-item" onclick="window.location.href='joborder.html'"><i class="fa-solid fa-clipboard-list"></i> Job Order Tracker</button>
    <button class="nav-item" onclick="window.location.href='orders.html'"><i class="fa-solid fa-boxes-stacked"></i> Orders</button>
    <button class="nav-item active" onclick="window.location.href='news.html'"><i class="fa-solid fa-newspaper"></i> News</button>
    <button class="nav-item" onclick="window.location.href='operation-records.html'"><i class="fa-solid fa-clipboard-check"></i> Operation Records</button>
    <button class="nav-item" onclick="window.location.href='live-seller-tracker.html'"><i class="fa-solid fa-chart-line"></i> Live Seller Tracker</button>
    <button class="nav-item" onclick="window.location.href='tiktok-calendar.html'"><i class="fa-brands fa-tiktok"></i> TikTok Calendar</button>
    <button class="nav-item" onclick="window.location.href='sewer-record.html'"><i class="fa-solid fa-user-gear"></i> Sewer Record</button>
  </aside>
  <div class="main-area">
    <header class="topbar"><div class="topbar-left"><button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button><div class="sidebar-brand" style="padding:0"><div class="login-mark" style="width:32px;height:32px;font-size:.85rem"><i class="fa-solid fa-box"></i></div><span>Stockline</span></div></div><div class="topbar-user"><span class="save-indicator" id="saveIndicator"></span>Signed in as <b>admin</b></div></header>
    <main class="wrap">
      <div class="alert alert-success" id="flash"><i class="fa-solid fa-circle-check"></i> <span id="flashMsg"></span></div>
      <div class="page-header"><div><h1>News</h1><p>Publish updates for your team.</p></div><button class="btn btn-primary" onclick="openModal('newsModal')"><i class="fa-solid fa-plus"></i> Create News</button></div>
      <div class="card"><div class="card-header"><h3><i class="fa-solid fa-newspaper" style="color:var(--blue)"></i> Published News (<span id="newsCount">0</span>)</h3></div><div id="newsList"></div></div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="newsModal"><div class="modal-box"><span class="modal-close" onclick="closeModal('newsModal')"><i class="fa-solid fa-xmark"></i></span><h3><i class="fa-solid fa-newspaper" style="color:var(--blue)"></i> Create News</h3><form onsubmit="return handleCreateNews(event)"><div class="form-group" style="margin-bottom:14px"><label for="news_title">Title</label><input type="text" id="news_title" maxlength="120" required></div><div class="form-group"><label for="news_content">News</label><textarea id="news_content" rows="6" maxlength="2000" required></textarea></div><div class="form-group" style="margin-top:14px"><label for="news_attachment">Attachment</label><input type="file" id="news_attachment" style="width:100%;padding:8px 0;font-family:inherit;font-size:.84rem"><span class="news-meta">Optional attachment, maximum 10 MB.</span></div><div class="modal-actions"><button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-check"></i> Publish News</button></div></form></div></div>
<script src="database.js"></script>
<script>
let news = [];
let nextNewsId = 1;
function setSaveIndicator(state){const el=document.getElementById('saveIndicator');el.className='save-indicator '+state;el.textContent=state==='saved'?'Saved':state==='saving'?'Saving...':state==='error'?'Save failed':''}
function showFlash(message,isError){const flash=document.getElementById('flash');flash.className=isError?'alert alert-error':'alert alert-success';document.getElementById('flashMsg').textContent=message;flash.style.display='block';setTimeout(()=>flash.style.display='none',2600)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed')}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]))}
function renderNews(){const sorted=[...news].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));document.getElementById('newsCount').textContent=sorted.length;document.getElementById('newsList').innerHTML=sorted.length?sorted.map(item=>`<article class="news-item"><h4>${escapeHtml(item.title)}</h4><p>${escapeHtml(item.content)}</p><div class="news-meta">Published ${new Date(item.createdAt).toLocaleString()}</div>${item.attachmentData?`<div class="news-attachment"><button class="btn btn-primary" type="button" onclick="viewNewsAttachment(${item.id})"><i class="fa-solid fa-paperclip"></i> View ${escapeHtml(item.attachmentName || 'attachment')}</button></div>`:''}<div style="margin-top:10px"><button class="btn btn-danger" type="button" onclick="handleDeleteNews(${item.id})"><i class="fa-solid fa-trash"></i> Delete</button></div></article>`).join(''):'<p class="legend">No news published yet.</p>'}
function readAttachment(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}
function viewNewsAttachment(id){const item=news.find(entry=>entry.id===id);if(!item||!item.attachmentData)return;const attachmentWindow=window.open(item.attachmentData,'_blank','noopener');if(!attachmentWindow)showFlash('Allow pop-ups to view the attachment.',true)}
async function handleDeleteNews(id){const item=news.find(entry=>entry.id===id);if(!item||!confirm(`Delete "${item.title}"?`))return;news=news.filter(entry=>entry.id!==id);renderNews();showFlash('News deleted.');await deleteRow(TABLE_NEWS,id)}
async function handleCreateNews(event){event.preventDefault();const title=document.getElementById('news_title').value.trim();const content=document.getElementById('news_content').value.trim();const file=document.getElementById('news_attachment').files[0];if(file&&file.size>10*1024*1024){showFlash('The attachment must be 10 MB or smaller.',true);return false}let attachmentData=null;if(file){try{attachmentData=await readAttachment(file)}catch(error){showFlash('Could not read the attachment.',true);return false}}const item={id:nextNewsId++,title,content,createdAt:new Date().toISOString(),attachmentName:file?file.name:'',attachmentType:file?file.type:'',attachmentData};news.push(item);event.target.reset();closeModal('newsModal');renderNews();showFlash('News published.');await saveRow(TABLE_NEWS,item);return false}
document.querySelectorAll('.modal-overlay').forEach(overlay=>overlay.addEventListener('click',event=>{if(event.target===overlay)overlay.classList.remove('open')}));
(async function(){await loadNewsData();renderNews()})();
</script>
</body>
</html>
