<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Calendar — Stockline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{--paper:#F3F4F1;--panel:#fff;--ink:#1B2430;--soft:#5B6472;--line:#E1E4E0;--blue:#2F5D9A;--blue-dark:#234876;--green:#3F7D4F;--green-bg:#E7F2E9;--red:#B4423A;--red-bg:#FBE9E7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}
  h1,h2,h3{margin:0;font-family:'Space Grotesk',sans-serif}
  .app-shell{display:flex;min-height:100vh}
  .sidebar{width:216px;flex-shrink:0;padding:18px 12px;background:var(--panel);border-right:1px solid var(--line);overflow:hidden;transition:width .18s ease,padding .18s ease}
  .sidebar.collapsed{width:0;padding-left:0;padding-right:0;border:0}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
  .sidebar-brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;white-space:nowrap}
  .login-mark{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:8px;background:var(--blue);color:#fff}
  .nav-label{margin:0 0 6px;padding:0 10px;color:var(--soft);font-size:.68rem;font-weight:700;letter-spacing:.04em}
  .nav-item{display:flex;width:100%;align-items:center;gap:10px;margin-bottom:2px;padding:9px 10px;border:0;border-radius:7px;background:none;color:var(--soft);font:600 .86rem Inter,sans-serif;text-align:left;white-space:nowrap;cursor:pointer}
  .nav-item i{width:16px;text-align:center}
  .nav-item:hover{background:var(--paper);color:var(--ink)}
  .nav-item.active{background:var(--blue);color:#fff}
  .main-area{flex:1;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .hamburger{width:34px;height:34px;border:0;border-radius:7px;background:none;color:var(--ink);font-size:1rem;cursor:pointer}
  .hamburger:hover{background:var(--paper)}
  .topbar-user{color:var(--soft);font-size:.85rem}
  .topbar-user b{color:var(--ink)}
  .save-state{margin-right:12px;font-size:.76rem}
  .save-state.saved{color:var(--green)}
  .save-state.saving{color:var(--blue)}
  .save-state.error{color:var(--red)}
  .wrap{max-width:1180px;margin:0 auto;padding:28px}
  .page-header{margin-bottom:20px}
  .page-header h1{font-size:1.5rem}
  .page-header p{margin:6px 0 0;color:var(--soft);font-size:.88rem}
  .campaign-section{margin-bottom:20px}
  .campaign-section-header{padding:16px 18px;border-bottom:1px solid var(--line)}
  .campaign-section-header h2{font-size:1.08rem}
  .campaign-section-header p{margin:5px 0 0;color:var(--soft);font-size:.82rem}
  .campaign-months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .campaign-month{min-width:0;padding:15px 16px 17px}
  .campaign-month+.campaign-month{border-left:1px solid var(--line)}
  .campaign-month h3{margin-bottom:12px;font-size:.94rem}
  .campaign-list{display:grid;gap:10px}
  .campaign-card{display:block;width:100%;padding:13px 12px;border:1px solid transparent;border-radius:7px;background:#eaf6f6;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
  .campaign-card:hover{border-color:#b9d9dc;background:#e2f2f3}
  .campaign-name{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700}
  .campaign-badge{padding:3px 7px;border-radius:99px;background:linear-gradient(100deg,#ff9b9b,#aaf1ec);font-size:.63rem;font-weight:700}
  .campaign-dates{margin-top:12px;font-size:.8rem}
  .campaign-note{margin:10px 0 0;padding:0 16px 14px;color:var(--soft);font-size:.72rem}
  .calendar-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
  .card{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .calendar-toolbar h2{font-size:1.1rem;text-align:center}
  .toolbar-actions{display:flex;gap:7px}
  .btn{display:inline-flex;min-height:36px;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border:1px solid transparent;border-radius:7px;font:600 .82rem Inter,sans-serif;cursor:pointer}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dark)}
  .btn-outline{border-color:var(--line);background:#fff;color:var(--ink)}
  .btn-outline:hover{border-color:var(--blue);color:var(--blue)}
  .btn-danger{background:var(--red-bg);color:var(--red)}
  .btn-icon{width:36px;padding:8px}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:12px;gap:4px}
  .weekday{padding:8px 2px;color:var(--soft);font-size:.73rem;font-weight:700;text-align:center}
  .day{position:relative;display:flex;min-height:76px;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border:1px solid transparent;border-radius:8px;background:#fff;color:var(--ink);font:500 .88rem Inter,sans-serif;cursor:pointer}
  .day:hover{border-color:#b9cbe0;background:#f6f9fd}
  .day.outside-month{color:#a2a8ae}
  .day.today{border-color:var(--blue)}
  .day.selected{background:#eaf1fb}
  .day.has-campaign{box-shadow:inset 0 0 0 1px #b6dedb}
  .day-number{line-height:1}
  .event-dots{display:flex;min-height:7px;justify-content:center;gap:3px}
  .event-dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}
  .event-dot.campaign-dot{background:#de8061}
  .day-count{color:var(--soft);font-size:.64rem}
  .calendar-legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 18px 15px;color:var(--soft);font-size:.74rem}
  .legend-item{display:inline-flex;align-items:center;gap:6px}
  .legend-dot{width:8px;height:8px;border-radius:50%;background:#de8061}
  .legend-dot.personal{background:var(--blue)}
  .day-panel{padding:18px}
  .day-panel h2{margin-bottom:14px;font-size:1.08rem}
  .event-form{display:grid;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .field label{display:block;margin-bottom:5px;font-size:.76rem;font-weight:700}
  .field input,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:.84rem}
  .field textarea{min-height:76px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
  .event-list{display:grid;gap:10px;padding-top:14px}
  .event-item{padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .event-item.campaign-event{border-color:#c5e3e1;background:#f0f9f8}
  .campaign-event-label{margin-bottom:5px;color:#357a79;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .event-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .event-title{font-size:.88rem;font-weight:700;overflow-wrap:anywhere}
  .event-time{margin-top:4px;color:var(--blue);font-size:.76rem;font-weight:600}
  .event-notes{margin:8px 0 0;color:var(--soft);font-size:.82rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .event-delete{flex:none;width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--red);cursor:pointer}
  .event-delete:hover{background:var(--red-bg)}
  .empty-events{margin:0;color:var(--soft);font-size:.84rem}
  .flash{display:none;margin-bottom:16px;padding:10px 13px;border-radius:7px;font-size:.84rem}
  .flash.success{display:block;background:var(--green-bg);color:var(--green)}
  .flash.error{display:block;background:var(--red-bg);color:var(--red)}
  @media(max-width:900px){.sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;width:240px;box-shadow:2px 0 16px #1b24302e}.sidebar.collapsed{width:0;box-shadow:none}.wrap{padding:20px 16px}.topbar{padding:12px 16px}}
  @media(max-width:760px){.calendar-layout{grid-template-columns:1fr}.campaign-months{grid-template-columns:1fr}.campaign-month{padding:12px 14px}.campaign-month+.campaign-month{border-top:1px solid var(--line);border-left:0}.campaign-list{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:58px}.calendar-toolbar{padding:12px}.toolbar-actions{gap:4px}.btn{padding:7px 9px}}
  @media(max-width:460px){.campaign-list{grid-template-columns:1fr}}
  @media(max-width:520px){.wrap{padding:16px 12px}.topbar-user .user-label{display:none}.calendar-grid{padding:8px;gap:2px}.day{min-height:48px;padding:7px 2px}.day-count{display:none}.weekday{font-size:.65rem}.page-header h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="login-mark"><i class="fa-solid fa-box"></i></div><span>Admin Dashboard</span></div>
    <p class="nav-label">Menu</p>
    <button class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
    <button class="nav-item" onclick="window.location.href='stocks.html'"><i class="fa-solid fa-ruler"></i> Stocks</button>
    <button class="nav-item" onclick="window.location.href='joborder.html'"><i class="fa-solid fa-clipboard-list"></i> Job Order Tracker</button>
    <button class="nav-item" onclick="window.location.href='orders.html'"><i class="fa-solid fa-boxes-stacked"></i> Orders</button>
    <button class="nav-item" onclick="window.location.href='news.html'"><i class="fa-solid fa-newspaper"></i> News</button>
    <button class="nav-item" onclick="window.location.href='operation-records.html'"><i class="fa-solid fa-clipboard-check"></i> Operation Records</button>
    <button class="nav-item" onclick="window.location.href='live-seller-tracker.html'"><i class="fa-solid fa-chart-line"></i> Live Seller Tracker</button>
    <button class="nav-item active" aria-current="page"><i class="fa-brands fa-tiktok"></i> TikTok Calendar</button>
    <button class="nav-item" onclick="window.location.href='sewer-record.html'"><i class="fa-solid fa-user-gear"></i> Sewer Record</button>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left"><button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button></div>
      <div class="topbar-user"><span class="save-state" id="saveState" aria-live="polite"></span><span class="user-label">Signed in as</span> <b id="whoami">admin</b></div>
    </header>
    <main class="wrap">
      <div class="page-header"><h1>TikTok Calendar</h1><p>Plan TikTok content, LIVE sessions, and reminders by date.</p></div>
      <div class="flash" id="flash" role="status" aria-live="polite"></div>
      <section class="card campaign-section" aria-labelledby="campaignScheduleTitle">
        <header class="campaign-section-header"><h2 id="campaignScheduleTitle">TikTok Campaign Schedule</h2><p>Campaign dates shown in your Seller Center calendar.</p></header>
        <div class="campaign-months" id="campaignMonths"></div>
        <p class="campaign-note">Select a campaign to jump to its start date in the calendar below.</p>
      </section>
      <div class="calendar-layout">
        <section class="card" aria-label="Monthly calendar">
          <div class="calendar-toolbar">
            <div class="toolbar-actions">
              <button class="btn btn-outline btn-icon" id="previousMonth" type="button" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
              <button class="btn btn-outline" id="todayButton" type="button">Today</button>
              <button class="btn btn-outline btn-icon" id="nextMonth" type="button" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <h2 id="monthLabel" aria-live="polite"></h2>
          </div>
          <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Calendar dates"></div>
          <div class="calendar-legend" aria-label="Calendar marker legend">
            <span class="legend-item"><span class="legend-dot" aria-hidden="true"></span>TikTok campaign</span>
            <span class="legend-item"><span class="legend-dot personal" aria-hidden="true"></span>Your events</span>
          </div>
        </section>
        <section class="card day-panel" aria-labelledby="selectedDate">
          <h2 id="selectedDate"></h2>
          <form class="event-form" id="eventForm">
            <div class="field"><label for="eventTitle">Event or content</label><input id="eventTitle" type="text" maxlength="120" placeholder="e.g. New arrivals LIVE" required></div>
            <div class="field"><label for="eventTime">Time (optional)</label><input id="eventTime" type="time"></div>
            <div class="field"><label for="eventNotes">Notes (optional)</label><textarea id="eventNotes" maxlength="1000" placeholder="Add details or reminders"></textarea></div>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-plus"></i> Add to calendar</button>
          </form>
          <div class="event-list" id="eventList" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
</div>
<script src="database.js"></script>
<script src="tiktok-campaigns.js"></script>
<script>
const CALENDAR_TABLE = 'tiktokcalendar';
const today = new Date();
let displayedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
let selectedDate = dateKey(today);
let calendarEvents = [];
let nextEventId = 1;

function dateKey(date){
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function parseDateKey(key){
  const [year, month, day] = key.split('-').map(Number);
  return new Date(year, month - 1, day);
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function setSaveIndicator(state){
  const element = document.getElementById('saveState');
  element.className = `save-state ${state}`;
  element.textContent = state === 'saving' ? 'Saving...' : state === 'saved' ? 'Saved' : state === 'error' ? 'Save failed' : '';
}

function showFlash(message, isError = false){
  const flash = document.getElementById('flash');
  flash.className = `flash ${isError ? 'error' : 'success'}`;
  flash.textContent = message;
  clearTimeout(showFlash.timer);
  showFlash.timer = setTimeout(() => { flash.className = 'flash'; }, 3000);
}

function eventsForDate(key){
  return calendarEvents.filter(item => item.date === key).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99') || a.id - b.id);
}

function campaignsForDate(key){
  return TIKTOK_CAMPAIGNS.flatMap(month => month.items)
    .filter(campaign => campaign.start <= key && key <= campaign.end);
}

function formatCampaignDateRange(start, end){
  const startDate = parseDateKey(start);
  const endDate = parseDateKey(end);
  const sameMonth = startDate.getMonth() === endDate.getMonth();
  const monthStart = startDate.toLocaleDateString(undefined, {month:'short'});
  const monthEnd = endDate.toLocaleDateString(undefined, {month:'short'});
  if(sameMonth) return `${monthStart} ${startDate.getDate()} - ${endDate.getDate()}`;
  return `${monthStart} ${startDate.getDate()} - ${monthEnd} ${endDate.getDate()}`;
}

function renderCampaignSchedule(){
  document.getElementById('campaignMonths').innerHTML = TIKTOK_CAMPAIGNS.map(month => `<section class="campaign-month">
    <h3>${escapeHtml(month.month)}</h3>
    <div class="campaign-list">${month.items.map(campaign => `<button type="button" class="campaign-card" data-campaign-start="${campaign.start}" aria-label="${escapeHtml(campaign.name)}, ${formatCampaignDateRange(campaign.start, campaign.end)}">
      <span class="campaign-name">${escapeHtml(campaign.name)}${campaign.mega ? '<span class="campaign-badge">MEGA</span>' : ''}</span>
      <span class="campaign-dates">${formatCampaignDateRange(campaign.start, campaign.end)}</span>
    </button>`).join('')}</div>
  </section>`).join('');
}

function renderCalendar(){
  const grid = document.getElementById('calendarGrid');
  document.getElementById('monthLabel').textContent = displayedMonth.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  document.getElementById('selectedDate').textContent = parseDateKey(selectedDate).toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const firstDay = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth(), 1);
  const start = new Date(firstDay.getFullYear(), firstDay.getMonth(), 1 - firstDay.getDay());
  const cells = weekdays.map(day => `<div class="weekday" role="columnheader">${day}</div>`);
  for(let index = 0; index < 42; index++){
    const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + index);
    const key = dateKey(date);
    const events = eventsForDate(key);
    const dayCampaigns = campaignsForDate(key);
    const classes = ['day'];
    if(date.getMonth() !== displayedMonth.getMonth()) classes.push('outside-month');
    if(key === dateKey(today)) classes.push('today');
    if(key === selectedDate) classes.push('selected');
    if(dayCampaigns.length) classes.push('has-campaign');
    const markers = [
      ...dayCampaigns.map(() => '<span class="event-dot campaign-dot"></span>'),
      ...events.map(() => '<span class="event-dot"></span>'),
    ];
    const dots = markers.slice(0, 3).join('');
    const count = markers.length > 3 ? `<span class="day-count">+${markers.length - 3}</span>` : '';
    const campaignNames = dayCampaigns.map(campaign => campaign.name).join(', ');
    const ariaSuffix = `${dayCampaigns.length ? `, campaigns: ${escapeHtml(campaignNames)}` : ''}${events.length ? `, ${events.length} calendar event${events.length === 1 ? '' : 's'}` : ''}`;
    cells.push(`<button type="button" class="${classes.join(' ')}" role="gridcell" aria-pressed="${key === selectedDate}" aria-label="${escapeHtml(date.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'}))}${ariaSuffix}" data-date="${key}"><span class="day-number">${date.getDate()}</span><span class="event-dots" aria-hidden="true">${dots}${count}</span></button>`);
  }
  grid.innerHTML = cells.join('');
  renderEvents();
}

function renderEvents(){
  const list = document.getElementById('eventList');
  const events = eventsForDate(selectedDate);
  const dayCampaigns = campaignsForDate(selectedDate);
  if(!events.length && !dayCampaigns.length){
    list.innerHTML = '<p class="empty-events">Nothing planned for this day yet.</p>';
    return;
  }
  const campaignItems = dayCampaigns.map(campaign => `<article class="event-item campaign-event">
    <div class="campaign-event-label">TikTok campaign</div>
    <div class="event-title">${escapeHtml(campaign.name)}${campaign.mega ? ' · MEGA' : ''}</div>
    <div class="event-time">${formatCampaignDateRange(campaign.start, campaign.end)}</div>
  </article>`).join('');
  list.innerHTML = campaignItems + events.map(item => `<article class="event-item">
    <div class="event-top"><div><div class="event-title">${escapeHtml(item.title)}</div>${item.time ? `<div class="event-time">${escapeHtml(new Date(`2000-01-01T${item.time}`).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}))}</div>` : ''}</div>
    <button class="event-delete" type="button" data-delete-event="${item.id}" aria-label="Delete ${escapeHtml(item.title)}"><i class="fa-solid fa-trash"></i></button></div>
    ${item.notes ? `<p class="event-notes">${escapeHtml(item.notes)}</p>` : ''}
  </article>`).join('');
}

document.getElementById('calendarGrid').addEventListener('click', event => {
  const day = event.target.closest('[data-date]');
  if(!day) return;
  selectedDate = day.dataset.date;
  const date = parseDateKey(selectedDate);
  displayedMonth = new Date(date.getFullYear(), date.getMonth(), 1);
  renderCalendar();
});

document.getElementById('campaignMonths').addEventListener('click', event => {
  const campaign = event.target.closest('[data-campaign-start]');
  if(!campaign) return;
  selectedDate = campaign.dataset.campaignStart;
  const date = parseDateKey(selectedDate);
  displayedMonth = new Date(date.getFullYear(), date.getMonth(), 1);
  renderCalendar();
  document.getElementById('calendarGrid').scrollIntoView({block:'nearest', behavior:'smooth'});
});

document.getElementById('previousMonth').addEventListener('click', () => {
  displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() - 1, 1);
  selectedDate = dateKey(displayedMonth);
  renderCalendar();
});

document.getElementById('nextMonth').addEventListener('click', () => {
  displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 1);
  selectedDate = dateKey(displayedMonth);
  renderCalendar();
});

document.getElementById('todayButton').addEventListener('click', () => {
  displayedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  selectedDate = dateKey(today);
  renderCalendar();
});

document.getElementById('eventForm').addEventListener('submit', async event => {
  event.preventDefault();
  const title = document.getElementById('eventTitle').value.trim();
  if(!title){
    showFlash('Enter a title for this calendar event.', true);
    return;
  }
  const item = {
    id: nextEventId++,
    date: selectedDate,
    title,
    time: document.getElementById('eventTime').value,
    notes: document.getElementById('eventNotes').value.trim(),
  };
  calendarEvents.push(item);
  renderCalendar();
  event.target.reset();
  await saveRow(CALENDAR_TABLE, item);
  showFlash('Calendar event added.');
});

document.getElementById('eventList').addEventListener('click', async event => {
  const button = event.target.closest('[data-delete-event]');
  if(!button) return;
  const id = Number(button.dataset.deleteEvent);
  const item = calendarEvents.find(entry => entry.id === id);
  if(!item || !confirm(`Delete "${item.title}" from the calendar?`)) return;
  calendarEvents = calendarEvents.filter(entry => entry.id !== id);
  renderCalendar();
  await deleteRow(CALENDAR_TABLE, id);
  showFlash('Calendar event deleted.');
});

async function initializeCalendar(){
  document.getElementById('whoami').textContent = sessionStorage.getItem('stockline-authenticated') === 'true' ? 'admin' : 'guest';
  renderCampaignSchedule();
  renderCalendar();
  try{
    calendarEvents = (await loadTable(CALENDAR_TABLE) || []).filter(item => Number.isSafeInteger(Number(item.id)) && /^\d{4}-\d{2}-\d{2}$/.test(item.date) && typeof item.title === 'string');
    nextEventId = calendarEvents.reduce((maximum, item) => Math.max(maximum, Number(item.id)), 0) + 1;
    renderCalendar();
  }catch(error){
    console.error('Failed to load TikTok calendar:', error);
    setSaveIndicator('error');
    showFlash('Could not load calendar events. Refresh to try again.', true);
  }
}

initializeCalendar();
</script>
</body>
</html>
