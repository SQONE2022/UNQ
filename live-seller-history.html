<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Seller History — Stockline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{--paper:#F3F4F1;--panel:#fff;--ink:#1B2430;--ink-soft:#5B6472;--line:#E1E4E0;--denim:#2F5D9A;--denim-dark:#234876;--red:#B4423A;--red-bg:#FBE9E7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}
  h1,h2,h3{margin:0;font-family:'Space Grotesk',sans-serif}
  .app-shell{display:flex;min-height:100vh}
  .sidebar{width:216px;flex-shrink:0;padding:18px 12px;background:var(--panel);border-right:1px solid var(--line);overflow:hidden;transition:width .18s ease,padding .18s ease}
  .sidebar.collapsed{width:0;padding-left:0;padding-right:0;border:0}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
  .sidebar-brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;white-space:nowrap}
  .login-mark{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:8px;background:var(--denim);color:#fff}
  .nav-label{margin:0 0 6px;padding:0 10px;color:var(--ink-soft);font-size:.68rem;font-weight:700;letter-spacing:.04em}
  .nav-item{display:flex;width:100%;align-items:center;gap:10px;margin-bottom:2px;padding:9px 10px;border:0;border-radius:7px;background:none;color:var(--ink-soft);font:600 .86rem Inter,sans-serif;text-align:left;white-space:nowrap;cursor:pointer}
  .nav-item i{width:16px;text-align:center}
  .nav-item:hover{background:var(--paper);color:var(--ink)}
  .nav-item.active{background:var(--denim);color:#fff}
  .main-area{flex:1;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .hamburger{width:34px;height:34px;border:0;border-radius:7px;background:none;color:var(--ink);font-size:1rem;cursor:pointer}
  .hamburger:hover{background:var(--paper)}
  .topbar-user{color:var(--ink-soft);font-size:.85rem}
  .topbar-user b{color:var(--ink)}
  .save-indicator{margin-right:12px;font-size:.76rem}
  .save-indicator.saved{color:#3F7D4F}
  .save-indicator.saving{color:var(--denim)}
  .save-indicator.error{color:var(--red)}
  .wrap{max-width:1180px;margin:0 auto;padding:28px}
  .page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .page-header h1{font-size:1.5rem}
  .page-header p{margin:6px 0 0;color:var(--ink-soft);font-size:.88rem}
  .btn{display:inline-flex;min-height:38px;align-items:center;justify-content:center;gap:8px;padding:8px 13px;border:1px solid transparent;border-radius:7px;font:600 .84rem Inter,sans-serif;text-decoration:none;cursor:pointer}
  .btn-outline{border-color:var(--line);background:#fff;color:var(--ink)}
  .btn-outline:hover{border-color:var(--denim);color:var(--denim)}
  .btn-danger{background:var(--red-bg);color:var(--red)}
  .btn-sm{min-height:32px;padding:6px 9px;font-size:.78rem}
  .flash{display:none;margin-bottom:16px;padding:10px 13px;border-radius:7px;font-size:.84rem}
  .flash.success{display:block;background:#E7F2E9;color:#3F7D4F}
  .flash.error{display:block;background:var(--red-bg);color:var(--red)}
  .date-filter{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 18px;margin-bottom:20px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .date-filter-field{display:grid;gap:5px}
  .date-filter-field label{color:var(--ink-soft);font-size:.73rem;font-weight:700}
  .date-filter input{min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit}
  .date-filter input:focus{outline:2px solid var(--denim);outline-offset:1px}
  .date-filter-note{margin:0 0 2px;color:var(--ink-soft);font-size:.78rem}
  .history-empty{padding:28px 18px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink-soft);font-size:.86rem;text-align:center}
  .history-entry{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .history-entry:first-child{margin-top:0}
  .history-entry-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .history-entry-header h2{font-size:1.02rem}
  .history-entry-date{margin:4px 0 0;color:var(--ink-soft);font-size:.78rem}
  .table-wrap{overflow-x:auto}
  .record-sheet{width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;background:#fff;font-family:Arial,sans-serif}
  .record-sheet.single-shift{min-width:560px}
  .record-sheet th,.record-sheet td{height:34px;padding:4px;border:1px solid #222;font-size:13px;text-align:center}
  .record-sheet .title-cell{height:31px;font-weight:700;font-size:14px}
  .record-sheet .seller-cell{height:31px}
  .record-sheet .info-label,.record-sheet .section-label{text-transform:uppercase}
  .record-sheet .section-label{font-weight:700}
  .record-sheet .group-heading{height:28px;background:#dceef2;text-transform:uppercase}
  .record-sheet .head-date{background:#b5cce8}
  .record-sheet .head-in{background:#dbe9c9}
  .record-sheet .head-out{background:#e7c4c8}
  .record-sheet .head-duration{background:#f3d1b5}
  .record-sheet .head-sales{background:#d9dcee}
  .record-sheet .column-heading{text-transform:uppercase;font-weight:400}
  .record-sheet .sunday-row td{height:25px;background:#dceef2;font-weight:700;letter-spacing:.08em}
  .record-sheet .absent-row td{background:#dceef2}
  .record-sheet .status-divider td{background:#f3d1b5}
  .record-sheet .half-day-label{background:#dceef2;font-weight:700}
  @media(max-width:900px){.sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;width:240px;box-shadow:2px 0 16px #1b24302e}.sidebar.collapsed{width:0;box-shadow:none}.wrap{padding:20px 16px}.topbar{padding:12px 16px}}
  @media(max-width:520px){.wrap{padding:16px 12px}.topbar{padding:12px 14px}.user-label{display:none}.history-entry{padding:12px}}
  @media print{
    body{background:#fff}
    .sidebar,.topbar,.page-header,.history-actions,.flash{display:none!important}
    .app-shell{display:block}.wrap{max-width:none;padding:0}
    .history-entry{break-inside:avoid;page-break-inside:avoid;border:0;padding:0;margin:0 0 18px}
    .table-wrap{overflow:visible}
    .record-sheet{min-width:0}
    .record-sheet th,.record-sheet .group-heading,.record-sheet .head-date,.record-sheet .head-in,.record-sheet .head-out,.record-sheet .head-duration,.record-sheet .head-sales,.record-sheet .sunday-row td,.record-sheet .absent-row td,.record-sheet .half-day-label{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:landscape;margin:12mm}
  }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar" aria-label="Main menu">
    <div class="sidebar-brand"><div class="login-mark"><i class="fa-solid fa-box"></i></div><span>Admin Dashboard</span></div>
    <p class="nav-label">Menu</p>
    <button class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
    <button class="nav-item" onclick="window.location.href='stocks.html'"><i class="fa-solid fa-ruler"></i> Stocks</button>
    <button class="nav-item" onclick="window.location.href='joborder.html'"><i class="fa-solid fa-clipboard-list"></i> Job Order Tracker</button>
    <button class="nav-item" onclick="window.location.href='orders.html'"><i class="fa-solid fa-boxes-stacked"></i> Orders</button>
    <button class="nav-item" onclick="window.location.href='news.html'"><i class="fa-solid fa-newspaper"></i> News</button>
    <button class="nav-item" onclick="window.location.href='operation-records.html'"><i class="fa-solid fa-clipboard-check"></i> Operation Records</button>
    <button class="nav-item" onclick="window.location.href='live-seller-tracker.html'"><i class="fa-solid fa-chart-line"></i> Live Seller Tracker</button>
    <button class="nav-item" onclick="window.location.href='tiktok-calendar.html'"><i class="fa-brands fa-tiktok"></i> TikTok Calendar</button>
    <button class="nav-item" onclick="window.location.href='sewer-record.html'"><i class="fa-solid fa-user-gear"></i> Sewer Record</button>
  </nav>
  <main class="main-area">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-user"><span class="save-indicator" id="saveIndicator" aria-live="polite"></span><span class="user-label">Signed in as</span> <b id="whoami">admin</b></div>
    </header>
    <div class="wrap">
      <div class="page-header">
        <div><h1>Completed records history</h1><p>Review completed daily time records. These saved records are read-only.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a class="btn btn-outline" href="live-seller-tracker.html"><i class="fa-solid fa-arrow-left"></i> Back to Live Seller Tracker</a>
          <button class="btn btn-outline" type="button" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
        </div>
      </div>
      <div class="flash" id="flash" role="status" aria-live="polite"></div>
      <section class="date-filter" aria-label="Filter history by record date">
        <div class="date-filter-field"><label for="historyDate">Record date</label><input id="historyDate" type="date"></div>
        <button class="btn btn-outline" id="clearHistoryDate" type="button"><i class="fa-solid fa-xmark"></i> Clear date</button>
        <p class="date-filter-note">Choose a date entered in the daily time record to find matching history.</p>
      </section>
      <div class="history-empty" id="historyEmpty" hidden></div>
      <div id="historyRecords" aria-live="polite"></div>
    </div>
  </main>
</div>
<script src="database.js"></script>
<script>
const TABLE_SELLER_TRACKER = 'sellertracker';
let historyRecords = [];
let deleteQueue = Promise.resolve();

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function setSaveIndicator(state){
  const indicator = document.getElementById('saveIndicator');
  indicator.className = `save-indicator ${state}`;
  indicator.textContent = state === 'saving' ? 'Saving...' : state === 'saved' ? 'Saved' : state === 'error' ? 'Save failed' : '';
}

function showFlash(message, isError = false){
  const flash = document.getElementById('flash');
  flash.className = `flash ${isError ? 'error' : 'success'}`;
  flash.textContent = message;
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
}

function displayTime(value){
  const match = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(value || ''));
  if(!match) return '';
  const hour24 = Number(match[1]);
  return `${hour24 % 12 || 12}:${match[2]} ${hour24 < 12 ? 'AM' : 'PM'}`;
}

function renderRecordRow(row, singleShift){
  if(row.type === 'divider'){
    const label = String(row.label || '');
    const normalized = label.toLowerCase();
    const className = normalized.includes('sunday') ? 'sunday-row' : normalized.includes('absent') ? 'sunday-row absent-row' : 'sunday-row status-divider';
    return `<tr class="${className}"><td colspan="${singleShift ? 5 : 7}">${escapeHtml(label)}</td></tr>`;
  }
  const date = escapeHtml(row.date || '');
  const duration = escapeHtml(row.duration || '');
  const sales = escapeHtml(row.sales || '');
  if(singleShift){
    if(row.type === 'halfDay'){
      return `<tr><td>${date}</td><td colspan="2" class="half-day-label">${escapeHtml(row.label || '**** HALF DAY ****')}</td><td>${duration}</td><td>${sales}</td></tr>`;
    }
    return `<tr><td>${date}</td><td>${escapeHtml(displayTime(row.morningIn))}</td><td>${escapeHtml(displayTime(row.morningOut))}</td><td>${duration}</td><td>${sales}</td></tr>`;
  }
  if(row.type === 'halfDay'){
    const morning = row.halfDayPeriod === 'morning';
    const morningCells = morning
      ? `<td colspan="2" class="half-day-label">${escapeHtml(row.label || '**** HALF DAY ****')}</td>`
      : `<td>${escapeHtml(displayTime(row.morningIn))}</td><td>${escapeHtml(displayTime(row.morningOut))}</td>`;
    const afternoonCells = morning
      ? `<td>${escapeHtml(displayTime(row.afternoonIn))}</td><td>${escapeHtml(displayTime(row.afternoonOut))}</td>`
      : `<td colspan="2" class="half-day-label">${escapeHtml(row.label || '**** HALF DAY ****')}</td>`;
    return `<tr><td>${date}</td>${morningCells}${afternoonCells}<td>${duration}</td><td>${sales}</td></tr>`;
  }
  return `<tr><td>${date}</td><td>${escapeHtml(displayTime(row.morningIn))}</td><td>${escapeHtml(displayTime(row.morningOut))}</td><td>${escapeHtml(displayTime(row.afternoonIn))}</td><td>${escapeHtml(displayTime(row.afternoonOut))}</td><td>${duration}</td><td>${sales}</td></tr>`;
}

function renderRecord(record, rows){
  const singleShift = record.layout === 'single';
  const columns = singleShift ? 5 : 7;
  const sellerName = record.sellerName || `Time record ${record.id}`;
  const completedAt = record.completedAt ? new Date(record.completedAt) : null;
  const completedLabel = completedAt && !Number.isNaN(completedAt.getTime()) ? completedAt.toLocaleString() : 'Completion date unavailable';
  const tableHeader = singleShift
    ? `<tr><th colspan="${columns}" class="title-cell">DAILY TIME RECORD</th></tr>
      <tr><td colspan="${columns}" class="seller-cell">${escapeHtml(record.sellerName || '')}</td></tr>
      <tr><td colspan="3" class="info-label">Official hours of arrival</td><td colspan="2">${escapeHtml(record.officialHours || '')}</td></tr>
      <tr><td colspan="${columns}" class="section-label">Submission: ${escapeHtml(record.submissionSchedule || '')}</td></tr>
      <tr><th class="column-heading head-date">Day</th><th class="column-heading head-in">Live in</th><th class="column-heading head-out">Live out</th><th class="column-heading head-duration">Duration</th><th class="column-heading head-sales">Sales</th></tr>`
    : `<tr><th colspan="${columns}" class="title-cell">DAILY TIME RECORD</th></tr>
      <tr><td colspan="${columns}" class="seller-cell">${escapeHtml(record.sellerName || '')}</td></tr>
      <tr><td colspan="2" class="info-label">Official hours of arrival</td><td colspan="3">${escapeHtml(record.officialHours || '')}</td><td class="info-label">Regular days</td><td colspan="1">${escapeHtml(record.regularDays || '')}</td></tr>
      <tr><td colspan="${columns}" class="section-label">Submission: ${escapeHtml(record.submissionSchedule || '')}</td></tr>
      <tr><th rowspan="2" class="column-heading head-date">Date</th><th colspan="2" class="group-heading">Morning</th><th colspan="2" class="group-heading">Afternoon</th><th rowspan="2" class="column-heading head-duration">Duration</th><th rowspan="2" class="column-heading head-sales">Sales</th></tr>
      <tr><th class="column-heading head-in">Live in</th><th class="column-heading head-out">Live out</th><th class="column-heading head-in">Live in</th><th class="column-heading head-out">Live out</th></tr>`;
  return `<article class="history-entry">
    <header class="history-entry-header">
      <div><h2>${escapeHtml(sellerName)}</h2><p class="history-entry-date">Completed ${escapeHtml(completedLabel)}</p></div>
      <button class="btn btn-danger btn-sm history-actions" type="button" data-delete-history="${Number(record.id)}" aria-label="Delete completed record for ${escapeHtml(sellerName)}"><i class="fa-solid fa-trash"></i> Delete</button>
    </header>
    <div class="table-wrap"><table class="record-sheet${singleShift ? ' single-shift' : ''}">
      <thead>${tableHeader}</thead>
      <tbody>${rows.map(row => renderRecordRow(row, singleShift)).join('')}</tbody>
      <tfoot><tr><td colspan="${columns}" class="seller-cell">${escapeHtml(record.approvedBy || '')}</td></tr><tr><td colspan="${columns}" class="seller-cell">${escapeHtml(record.approverRole || '')}</td></tr></tfoot>
    </table></div>
  </article>`;
}

function renderHistory(){
  historyRecords.sort((a, b) => String(b.completedAt || '').localeCompare(String(a.completedAt || '')) || Number(b.id) - Number(a.id));
  const selectedDate = document.getElementById('historyDate').value;
  const matchingRecords = historyRecords.map(record => ({
    record,
    rows:Array.isArray(record.rows) ? record.rows.filter(row => !selectedDate || row.date === selectedDate) : [],
  })).filter(item => !selectedDate || item.rows.length > 0);
  const empty = document.getElementById('historyEmpty');
  empty.hidden = matchingRecords.length > 0;
  empty.textContent = selectedDate
    ? `No completed records contain entries for ${selectedDate}.`
    : 'No completed records yet. Mark a table Done in Live Seller Tracker to save it here.';
  document.getElementById('historyRecords').innerHTML = matchingRecords
    .map(({record, rows}) => renderRecord(record, rows)).join('');
}

async function deleteHistoryRecord(id, button){
  const record = historyRecords.find(item => Number(item.id) === id);
  if(!record || !confirm(`Delete the completed history for ${record.sellerName || 'this time record'}? This cannot be undone.`)) return;
  button.disabled = true;
  const marker = {id, deleted:true, profile:record.profile};
  deleteQueue = deleteQueue.then(() => saveRow(TABLE_SELLER_TRACKER, marker));
  await deleteQueue;
  if(document.getElementById('saveIndicator').classList.contains('error')){
    button.disabled = false;
    return;
  }
  historyRecords = historyRecords.filter(item => Number(item.id) !== id);
  renderHistory();
  showFlash('Completed history deleted.', false);
}

document.getElementById('historyRecords').addEventListener('click', event => {
  const button = event.target.closest('[data-delete-history]');
  if(button) deleteHistoryRecord(Number(button.dataset.deleteHistory), button);
});
document.getElementById('historyDate').addEventListener('change', renderHistory);
document.getElementById('clearHistoryDate').addEventListener('click', () => {
  document.getElementById('historyDate').value = '';
  renderHistory();
});

async function initializeHistory(){
  document.getElementById('whoami').textContent = sessionStorage.getItem('stockline-authenticated') === 'true' ? 'admin' : 'guest';
  try{
    const loaded = await loadTable(TABLE_SELLER_TRACKER) || [];
    historyRecords = loaded.filter(item => !item.deleted && item.completed && Number.isSafeInteger(Number(item.id)));
    renderHistory();
  }catch(error){
    console.error('Failed to load completed live seller history:', error);
    setSaveIndicator('error');
    showFlash('Could not load completed history. Refresh to try again.', true);
  }
}

initializeHistory();
</script>
</body>
</html>
